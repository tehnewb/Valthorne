// Compile application sources against the desktop engine.
sourceSets {
    game {
        java.srcDir providers.gradleProperty('applicationSources').orElse('src/game/java')
        if (providers.gradleProperty('applicationIncludes').isPresent()) java.include providers.gradleProperty('applicationIncludes').get().split(',')
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
        if (providers.gradleProperty('applicationResources').isPresent()) resources.srcDir providers.gradleProperty('applicationResources').get()
    }
}
configurations {
    gameImplementation.extendsFrom implementation, api
    gameRuntimeOnly.extendsFrom runtimeOnly
}
tasks.register('runGame', JavaExec) {
    group = 'application'
    classpath = sourceSets.game.runtimeClasspath
    mainClass = providers.gradleProperty('applicationMain')
}
