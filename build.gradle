plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish' version '0.36.0'
}

group = "io.github.tehnewb"
version = providers.gradleProperty('releaseVersion')
        .orElse(providers.gradleProperty('version'))
        .get()
description = "A 2D game development library"

def githubPackages = providers.gradleProperty('githubPackages').map { it.toBoolean() }.getOrElse(false)
if (githubPackages && !(version.toString() ==~ /\d+\.\d+\.\d+\.\d+-dev\.[0-9a-f]{40}\.\d+\.\d+/))
    throw new GradleException('GitHub Packages requires a development version containing the full commit SHA, run ID, and attempt.')
if (githubPackages && providers.gradleProperty('releaseSigning').map { it.toBoolean() }.getOrElse(false))
    throw new GradleException('Development packages must not enable release signing.')

if (githubPackages) {
    publishing {
        repositories {
            maven {
                name = 'githubPackages'
                url = uri('https://maven.pkg.github.com/tehnewb/Valthorne')
                credentials {
                    username = providers.environmentVariable('GITHUB_ACTOR').orNull
                    password = providers.environmentVariable('GITHUB_TOKEN').orNull
                }
            }
        }
    }
}

repositories {
    mavenCentral()
}

def lwjglVersion = "3.4.3"
def joltVersion = "6.0.0"

def lwjglModules = [
        "lwjgl",
        "lwjgl-glfw",
        "lwjgl-opengl",
        "lwjgl-bgfx",
        "lwjgl-stb",
        "lwjgl-freetype",
        "lwjgl-harfbuzz",
        "lwjgl-msdfgen",
        "lwjgl-openal",
        "lwjgl-yoga",
        "lwjgl-nanovg",
        "lwjgl-tinyfd"
]

def lwjglNativeClassifiers = [
        "natives-windows",
        "natives-windows-arm64",
        "natives-macos",
        "natives-macos-arm64",
        "natives-linux",
        "natives-linux-arm64",
        "natives-linux-arm32",
]

dependencies {
    api 'net.onedaybeard.artemis:artemis-odb:2.3.0'
    api platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    api 'org.joml:joml:1.10.9'
    api 'org.joml:joml-primitives:1.10.0'

    // API (what consumers compile against)
    lwjglModules.each { m ->
        api "org.lwjgl:${m}"
    }

    implementation "com.googlecode.soundlibs:mp3spi:1.9.5-1"
    implementation "com.googlecode.soundlibs:tritonus-share:0.3.7-2"
    implementation "org.apache.commons:commons-compress:1.28.0"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.18.2"
    // Jolt remains shared with constrained 2D physics.
    implementation "com.github.stephengold:jolt-jni-Windows64:$joltVersion"
    ['Windows64', 'Windows_ARM64', 'Linux64', 'Linux_ARM64', 'Linux_ARM32hf', 'MacOSX64', 'MacOSX_ARM64'].each { platform ->
        runtimeOnly "com.github.stephengold:jolt-jni-${platform}:$joltVersion:ReleaseSp"
    }

    // Runtime natives for ALL supported OS/arch combos.
    // These will be published so consumers get them transitively at runtime.
    lwjglModules.each { m ->
        lwjglNativeClassifiers.each { c ->
            runtimeOnly "org.lwjgl:${m}::${c}"
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }

    withSourcesJar()
}

apply from: 'gradle/bgfx.gradle'
// Only production sources and resources belong in the library.
sourceSets.main.java.exclude 'valthorne/threed/**', 'valthorne/ui/engine/**'
sourceSets.main.resources.exclude 'ui/icons/**', 'ui/scene-selection.png',
        'valthorne/filament/**', 'valthorne/shaders/model3d/**',
        'valthorne/shaders/pathtrace/**', 'META-INF/licenses/*filament*'
tasks.withType(Jar).configureEach {
    exclude 'valthorne/threed/**', 'valthorne/ui/engine/**', 'ui/icons/**',
            'ui/scene-selection.png', 'valthorne/filament/**',
            'valthorne/shaders/model3d/**', 'valthorne/shaders/pathtrace/**',
            'META-INF/licenses/*filament*'
}

mavenPublishing {
    if (!githubPackages) publishToMavenCentral()

    if (providers.gradleProperty('releaseSigning')
            .map { it.toBoolean() }
            .getOrElse(false)) {
        signAllPublications()
    }

    coordinates(
            group.toString(),
            githubPackages ? 'valthorne' : project.name.toString(),
            version.toString()
    )

    pom {
        name = "Valthorne"
        description = "2D game library"
        inceptionYear = "2025"
        url = "https://github.com/tehnewb/Valthorne"

        licenses {
            license {
                name = "The Apache License, Version 2.0"
                url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
                distribution = "repo"
            }
        }

        developers {
            developer {
                id = "tehnewb"
                name = "Albert Beaupre"
                url = "https://github.com/tehnewb/"
            }
        }

        scm {
            url = "https://github.com/tehnewb/Valthorne"
            connection = "scm:git:https://github.com/tehnewb/Valthorne.git"
            developerConnection = "scm:git:ssh://git@github.com/tehnewb/Valthorne.git"
        }
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('jar', Jar) {
    from('LICENSE') { into 'META-INF' }
    from('THIRD_PARTY_NOTICES.md') { into 'META-INF' }
    manifest {
        attributes('Implementation-Title': 'Valthorne',
                'Implementation-Version': project.version.toString())
    }
}

// Shared-source desktop/web application entry point.
apply from: 'portable/desktop.gradle'

// The publishing plugin owns the single Javadoc archive producer.
tasks.named('assemble') { dependsOn tasks.matching { it.name == 'plainJavadocJar' } }
