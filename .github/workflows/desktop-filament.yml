name: Desktop Filament
on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'portable/**'
      - 'gradle/**'
      - 'build.gradle'
      - '.github/workflows/desktop-filament.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'portable/**'
      - 'gradle/**'
      - 'build.gradle'
      - '.github/workflows/desktop-filament.yml'
permissions:
  contents: read

jobs:
  native-compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify platform selection and native physics without a graphics context
        shell: bash
        run: ./gradlew runGame -PapplicationSources=portable/verification/java -PapplicationMain=valthorne.verification.DesktopNativeVerification --console=plain
      - name: Retain native compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-compatibility-${{ matrix.os }}
          path: build/reports/verification/desktop-native.json
          if-no-files-found: error

  smoke:
    # Hosted runners do not guarantee accelerated OpenGL/NSGL. Renderer checks
    # remain explicitly requested; automatic verification above is truly headless.
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Linux graphics dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libxrandr2 libxi6 libxcursor1 libxinerama1 libasound2t64
      - name: Linux renderer smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a ./gradlew -p portable runGame -Ptarget=desktop -PapplicationMain=compatibility.CommonSceneApplication
      - name: Windows and macOS renderer smoke
        if: runner.os != 'Linux'
        shell: bash
        run: ./gradlew -p portable runGame -Ptarget=desktop -PapplicationMain=compatibility.CommonSceneApplication
      - name: Retain native reports and images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filament-${{ matrix.os }}
          path: |
            build/reports/
            build/fps-arena/
