// Generate disposable applications under ignored build output. No test/example
// folders are required in the checkout or included in published artifacts.
def consumerDirectory = layout.buildDirectory.dir('release-consumer')
tasks.register('prepareReleaseConsumer') {
    description = 'Prepares a temporary application to verify the published library.'
    group = 'verification'
    outputs.dir consumerDirectory
    doLast {
        def directory = consumerDirectory.get().asFile
        def sources = new File(directory, 'src/main/java')
        sources.mkdirs()
        new File(directory, 'settings.gradle').setText("rootProject.name = 'valthorne-release-consumer'\n", 'UTF-8')
        new File(directory, 'build.gradle').setText('''
plugins { id 'application' }
repositories {
    maven {
        url = uri(providers.gradleProperty('valthorneRepository').get())
        content { includeGroup 'io.github.tehnewb' }
        if (providers.gradleProperty('pomOnly').getOrElse('false').toBoolean()) {
            metadataSources { mavenPom(); ignoreGradleMetadataRedirection() }
        }
    }
    mavenCentral { content { excludeGroup 'io.github.tehnewb' } }
}
dependencies {
    implementation "io.github.tehnewb:Valthorne:${providers.gradleProperty('valthorneVersion').get()}"
}
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
application {
    mainClass = 'ReleaseProbe'
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
    if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('mac')) {
        applicationDefaultJvmArgs += '-XstartOnFirstThread'
    }
}
tasks.named('run', JavaExec) {
    if (providers.gradleProperty('graphics').getOrElse('false').toBoolean()) args '--graphics'
}
''', 'UTF-8')
        new File(sources, 'ReleaseProbe.java').setText('''
import org.joml.Vector3f;
import org.joml.primitives.Rayf;
import org.lwjgl.system.MemoryUtil;
import org.lwjgl.util.yoga.Yoga;
import valthorne.*;
import valthorne.camera.PerspectiveCamera;
import valthorne.graphics.Color;
import valthorne.graphics.shader.ShaderSources;
import valthorne.graphics.texture.TextureBatch;
import valthorne.math.physics.PhysicsWorld3D;
import static org.lwjgl.opengl.GL11.*;

public final class ReleaseProbe {
    public static void main(String[] args) throws Exception {
        try (var callback = org.lwjgl.glfw.GLFWErrorCallback.createPrint(System.err)) {
            org.lwjgl.glfw.GLFW.glfwSetErrorCallback(callback);
            run(args);
            org.lwjgl.glfw.GLFW.glfwSetErrorCallback(null);
        }
    }
    private static void run(String[] args) throws Exception {
        var position = new Vector3f(0, 0, 5);
        var camera = new PerspectiveCamera();
        camera.setPosition(position.x, position.y, position.z);
        new Rayf();
        if (ShaderSources.load("core/shape.vert").isBlank()) throw new AssertionError("Missing shader");
        for (String resource : new String[]{"/ui/AtkinsonHyperlegible-Regular.ttf",
                "/valthorne/filament/surface.filamat", "/META-INF/LICENSE"}) {
            try (var input = JGL.class.getResourceAsStream(resource)) {
                if (input == null || input.read() == -1) throw new AssertionError("Missing " + resource);
            }
        }
        var buffer = MemoryUtil.memAlloc(8);
        MemoryUtil.memFree(buffer);
        long node = Yoga.YGNodeNew();
        if (node == 0) throw new AssertionError("Yoga allocation failed");
        Yoga.YGNodeFree(node);
        try (var physics = new PhysicsWorld3D()) {
            physics.step();
            if (physics.getStepCount() != 1) throw new AssertionError("Jolt did not step");
        }
        if (java.util.Arrays.asList(args).contains("--graphics")) {
            JGL.init(new Application() {
                private int frames;
                public void init() {
                    var batch = new TextureBatch(16);
                    batch.dispose();
                }
                public void update(float delta) { if (++frames >= 3) Window.requestClose(); }
                public void render() {
                    Window.clear(new Color(.25f, .5f, .75f, 1));
                    var pixel = MemoryUtil.memAlloc(4);
                    try {
                        glReadPixels(0, 0, 1, 1, GL_RGBA, GL_UNSIGNED_BYTE, pixel);
                        int green = Byte.toUnsignedInt(pixel.get(1));
                        if (green < 125 || green > 130) throw new AssertionError("Unexpected rendered pixel: " + green);
                        if (glGetError() != GL_NO_ERROR) throw new AssertionError("OpenGL error");
                    } finally { MemoryUtil.memFree(pixel); }
                }
                public void dispose() {}
            }, JGLConfiguration.defaults().title("Valthorne release check").size(64, 64).visible(false));
        }
        System.out.println("Published Valthorne consumer passed on " + System.getProperty("os.name")
                + "/" + System.getProperty("os.arch") + " graphics=" + java.util.Arrays.asList(args).contains("--graphics"));
    }
}
''', 'UTF-8')
    }
}
