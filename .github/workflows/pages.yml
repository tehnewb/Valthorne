name: Website redirect
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-redirect
  cancel-in-progress: false
jobs:
  redirect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Generate redirect to standalone website
        run: |
          mkdir redirect
          cat > redirect/index.html <<'HTML'
          <!doctype html><html lang="en"><meta charset="utf-8"><title>Valthorne website moved</title><meta http-equiv="refresh" content="0;url=https://tehnewb.github.io/Valthorne-website/"><link rel="canonical" href="https://tehnewb.github.io/Valthorne-website/"><a href="https://tehnewb.github.io/Valthorne-website/">Visit the Valthorne website</a><script>location.replace('https://tehnewb.github.io/Valthorne-website/'+location.search+location.hash)</script></html>
          HTML
          cp redirect/index.html redirect/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: redirect
      - uses: actions/deploy-pages@v4
        id: deployment
