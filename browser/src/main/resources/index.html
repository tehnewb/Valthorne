<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Valthorne</title>
    <style>
        html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; }
        canvas { display:block; width:100%; height:100%; outline:none; touch-action:none; }
        #error { position:absolute; inset:0; margin:0; padding:1em; color:#fff; background:#211; white-space:pre-wrap; display:none; }
    </style>
</head>
<body>
    <canvas id="canvas" tabindex="0"></canvas>
    <pre id="error" role="alert"></pre>
    <script type="module">
        import {launch} from './runtime.mjs';
        const report=error=>{const box=document.querySelector('#error');box.textContent=String(error.stack||error);box.style.display='block';console.error(error);};
        window.addEventListener('unhandledrejection',event=>report(event.reason));
        window.addEventListener('error',event=>report(event.error||event.message));
        launch(document.querySelector('#canvas')).then(host=>host.completion.catch(report)).catch(report);
    </script>
</body>
</html>
