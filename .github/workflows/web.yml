name: Web compatibility

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEBGPU_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: portable/web/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned browser tooling
        working-directory: portable/web
        run: npm ci && npx playwright install --with-deps chrome
      - name: Verify portable core and unchanged application sources
        run: |
          ./gradlew -p portable :core:verifyCoreCompatibility --console=plain
          node portable/web/verify-compatibility.mjs
      - name: Test browser examples
        working-directory: portable/web
        run: npm run verify:examples
      - name: Check out maintained examples
        uses: actions/checkout@v4
        with:
          repository: tehnewb/Valthorne-examples
          ref: d9c8ba498674686efc41f8e7ce0a343d95159e5e
          path: Valthorne-examples
      - name: Test full shared FPS application
        env:
          VALTHORNE_EXAMPLES_DIR: Valthorne-examples
        run: node portable/fps.mjs verify web
      - name: Retain browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-compatibility
          path: |
            portable/core/build/reports/
            portable/web/build/verification/
            portable/web/build/*.json
            portable/web/build/*.png
          if-no-files-found: ignore
