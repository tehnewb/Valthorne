plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish' version '0.36.0'
}

group = "io.github.tehnewb"
version = providers.gradleProperty('releaseVersion')
        .orElse(providers.gradleProperty('version'))
        .get()
description = "A 2D game development library"

repositories {
    mavenCentral()
}

def lwjglVersion = "3.4.3"
def joltVersion = "6.0.0"

// If you want more modules, add them to both lists below.
def lwjglModules = [
        "lwjgl",
        "lwjgl-glfw",
        "lwjgl-opengl",
        "lwjgl-bgfx",
        "lwjgl-stb",
        "lwjgl-openal",
        "lwjgl-yoga",
        "lwjgl-nanovg"
]

// “All natives” set (common targets).
def lwjglNativeClassifiers = [
        "natives-windows",
        "natives-windows-arm64",
        "natives-macos",
        "natives-macos-arm64",
        "natives-linux",
        "natives-linux-arm64",
        "natives-linux-arm32",
]

dependencies {
    api platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    api 'org.joml:joml:1.10.9'
    api 'org.joml:joml-primitives:1.10.0'

    // API (what consumers compile against)
    lwjglModules.each { m ->
        api "org.lwjgl:${m}"
    }

    implementation "com.googlecode.soundlibs:mp3spi:1.9.5-1"
    implementation "com.googlecode.soundlibs:tritonus-share:0.3.7-2"
    implementation "org.apache.commons:commons-compress:1.28.0"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.18.2"
    // Shared Jolt native runtime supports constrained 2D simulation too.
    implementation "com.github.stephengold:jolt-jni-Windows64:$joltVersion"
    ['Windows64', 'Windows_ARM64', 'Linux64', 'Linux_ARM64', 'Linux_ARM32hf', 'MacOSX64', 'MacOSX_ARM64'].each { platform ->
        runtimeOnly "com.github.stephengold:jolt-jni-${platform}:$joltVersion:ReleaseSp"
    }

    // Runtime natives for ALL supported OS/arch combos.
    // These will be published so consumers get them transitively at runtime.
    lwjglModules.each { m ->
        lwjglNativeClassifiers.each { c ->
            runtimeOnly "org.lwjgl:${m}::${c}"
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }

    withSourcesJar()
    withJavadocJar()
}

apply from: 'gradle/benchmarks.gradle'
apply from: 'gradle/bgfx.gradle'

mavenPublishing {
    publishToMavenCentral()

    if (providers.gradleProperty('releaseSigning')
            .map { it.toBoolean() }
            .getOrElse(false)) {
        signAllPublications()
    }

    coordinates(
            group.toString(),
            project.name.toString(),
            version.toString()
    )

    pom {
        name = "Valthorne"
        description = "2D game library"
        inceptionYear = "2025"
        url = "https://github.com/tehnewb/Valthorne"

        licenses {
            license {
                name = "The Apache License, Version 2.0"
                url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
                distribution = "repo"
            }
        }

        developers {
            developer {
                id = "tehnewb"
                name = "Albert Beaupre"
                url = "https://github.com/tehnewb/"
            }
        }

        scm {
            url = "https://github.com/tehnewb/Valthorne"
            connection = "scm:git:https://github.com/tehnewb/Valthorne.git"
            developerConnection = "scm:git:ssh://git@github.com/tehnewb/Valthorne.git"
        }
    }
}


// The editor is installed locally and is never part of a public checkout.
def editorPrototype = providers.gradleProperty('editorPrototype').map { it.toBoolean() }
        .getOrElse(file('.prototype-editor/editor.gradle').isFile())
if (editorPrototype) {
    if (!file('.prototype-editor/editor.gradle').isFile()) throw new GradleException('The local editor prototype is not installed.')
    apply from: '.prototype-editor/editor.gradle'
} else {
    sourceSets.main.java.exclude 'valthorne/ui/engine/**'
    sourceSets.test.java.exclude 'valthorne/ui/engine/**'
    sourceSets.main.resources.exclude 'ui/icons/**', 'ui/scene-selection.png'
    tasks.withType(Jar).configureEach { exclude 'valthorne/ui/engine/**', 'ui/icons/**', 'ui/scene-selection.png' }
}
tasks.matching { it.name.startsWith('publish') }.configureEach {
    doFirst {
        if (editorPrototype) throw new GradleException('Publish with -PeditorPrototype=false to exclude the local editor.')
    }
}

apply from: 'gradle/editor-boundary.gradle'

apply from: 'gradle/release.gradle'

// Shared-source desktop/web application entry point.
apply from: 'portable/desktop.gradle'
