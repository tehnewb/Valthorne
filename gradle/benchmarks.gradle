// Optional local benchmarks. Their sources and generated reports stay out of Git.
// Keep the source set name stable for historical benchmark scripts.
sourceSets {
    uiBenchmark {
        java.srcDir 'src/benchmark/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    uiBenchmarkImplementation.extendsFrom implementation, api
    uiBenchmarkRuntimeOnly.extendsFrom runtimeOnly
}
dependencies {
    uiBenchmarkImplementation 'org.openjdk.jmh:jmh-core:1.37'
    uiBenchmarkAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

tasks.register('benchmarkUI', JavaExec) {
    description = 'Runs forked UI microbenchmarks with allocation profiling and JSON output.'
    group = 'verification'
    classpath = sourceSets.uiBenchmark.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    def report = providers.gradleProperty('uiBenchmarkReport').orElse('build/reports/ui-benchmark/results.json')
    args 'valthorne.ui.benchmark.*', '-foe', 'true', '-prof', 'gc', '-rf', 'json', '-rff', report.get()
    doFirst { file(report.get()).parentFile.mkdirs() }
}

