name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and consumer / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      ALSOFT_DRIVERS: 'null'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check wrapper integrity
        uses: gradle/actions/wrapper-validation@v4
      - name: Build and validate publication consumers
        shell: bash
        run: bash ./gradlew verifyRelease --stacktrace --console=plain
      - name: Validate macOS application launch and rendering
        # The hosted ARM64 VM cannot supply an NSGL OpenGL pixel format.
        # Keep its build/native checks; exercise rendering on the Intel runner.
        if: matrix.os == 'macos-15-intel'
        shell: bash
        run: bash ./gradlew verifyGraphicsConsumer --stacktrace --console=plain
      - name: Retain reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore

  graphics:
    name: Linux OpenGL regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install display and Mesa runtime
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0 libxrandr2 libxinerama1 libxcursor1 libxi6 fonts-dejavu-core
      - name: Validate published-library rendering
        run: xvfb-run -a bash ./gradlew verifyGraphicsConsumer --stacktrace --console=plain
      - name: Retain graphics reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-linux-graphics
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore
