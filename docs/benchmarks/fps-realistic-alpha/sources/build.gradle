tasks.register('runFpsArena', JavaExec) {
    description = 'Runs the first-person combat arena; --smoke checks controls, --benchmark measures combat workloads.'
    group = 'application'
    classpath = sourceSets.examples.runtimeClasspath
    mainClass = 'valthorne.examples.FpsArena'
}

tasks.register('verifyFpsArena', JavaExec) {
    description = 'Checks native player movement, combat, waves and gameplay resource ownership without a window.'
    group = 'verification'
    classpath = sourceSets.examples.runtimeClasspath
    mainClass = 'valthorne.examples.FpsArenaValidation'
}

['Combat', 'Environment'].each { category ->
    tasks.register("verifyFps${category}Assets", JavaExec) {
        description = "Checks packaged FPS ${category.toLowerCase()} geometry, materials and dependencies."
        group = 'verification'
        classpath = sourceSets.examples.runtimeClasspath
        mainClass = "valthorne.examples.Fps${category}Models"
    }
}

tasks.register('verifyFpsAssets') {
    description = 'Validates all downloaded FPS combat and environment assets without a window.'
    group = 'verification'
    dependsOn 'verifyFpsCombatAssets', 'verifyFpsEnvironmentAssets'
}

// Material packages are committed so consumers do not need a native compiler.
// Binding 0.4.0 uses Filament material ABI 75, not the newer SDK ABI 76.
def filamentMaterialTasks = ['surface', 'glass', 'alpha'].collect { materialName ->
    tasks.register("compileFilament${materialName.capitalize()}Material", Exec) {
        group = 'build'
        def source = file("src/main/resources/valthorne/filament/${materialName}.mat")
        def output = file("src/main/resources/valthorne/filament/${materialName}.filamat")
        def compiler = providers.gradleProperty('filamentMatc').orElse(file('build/filament-sdk-1.75/bin/matc.exe').absolutePath)
        inputs.file(source)
        outputs.file(output)
        doFirst {
            if (!file(compiler.get()).isFile()) throw new GradleException('Set -PfilamentMatc to matc from Filament 1.75.0.')
            def abi = providers.exec { commandLine compiler.get(), '--version' }.standardOutput.asText.get().trim()
            if (abi != '75') throw new GradleException("Filament material ABI must be 75, received ${abi}.")
            commandLine compiler.get(), '-p', 'desktop', '-a', 'opengl', '-o', output.absolutePath, source.absolutePath
        }
    }
}
tasks.register('compileFilamentMaterials') {
    group = 'build'
    description = 'Rebuilds Filament material packages using the pinned SDK material ABI.'
    dependsOn filamentMaterialTasks
}
tasks.named('processResources') { mustRunAfter filamentMaterialTasks }
