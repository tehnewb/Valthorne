plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish' version '0.36.0'
}

group = "io.github.tehnewb"
version = "1.4.6"
description = "A 2D and 3D game development library"

repositories {
    mavenCentral()
}

def lwjglVersion = "3.4.1"
def joltVersion = "6.0.0"

// If you want more modules, add them to both lists below.
def lwjglModules = [
        "lwjgl",
        "lwjgl-glfw",
        "lwjgl-opengl",
        "lwjgl-stb",
        "lwjgl-openal",
        "lwjgl-yoga",
        "lwjgl-nanovg"
]

// “All natives” set (common targets).
def lwjglNativeClassifiers = [
        "natives-windows",
        "natives-windows-arm64",
        "natives-macos",
        "natives-macos-arm64",
        "natives-linux",
        "natives-linux-arm64",
        "natives-linux-arm32",
]

dependencies {
    api platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    api 'org.joml:joml:1.10.8'
    api 'org.joml:joml-primitives:1.10.0'

    // API (what consumers compile against)
    lwjglModules.each { m ->
        api "org.lwjgl:${m}"
    }

    implementation "com.googlecode.soundlibs:mp3spi:1.9.5-1"
    implementation "com.googlecode.soundlibs:tritonus-share:0.3.7-2"
    implementation "org.apache.commons:commons-compress:1.28.0"
    implementation "org.dyn4j:dyn4j:5.0.2"
    // Desktop Filament C/FFM bindings, including published native runtimes.
    implementation "io.github.erkko68.filament-ffm:filament-ffm-runtime-windows-x64:0.4.0"
    // Platform-independent Jolt JNI classes; platform suffix is the upstream publication name.
    implementation "com.github.stephengold:jolt-jni-Windows64:$joltVersion"
    ["Windows64", "Windows_ARM64", "Linux64", "Linux_ARM64", "Linux_ARM32hf", "MacOSX64", "MacOSX_ARM64"].each { platform ->
        runtimeOnly "com.github.stephengold:jolt-jni-${platform}:$joltVersion:ReleaseSp"
    }
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"

    // Runtime natives for ALL supported OS/arch combos.
    // These will be published so consumers get them transitively at runtime.
    lwjglModules.each { m ->
        lwjglNativeClassifiers.each { c ->
            runtimeOnly "org.lwjgl:${m}::$c"
        }
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
    withJavadocJar()
}

// Run the committed 3D regressions independently of local, ignored demo/test sources.
sourceSets {
    audioExamples {
        java.srcDir 'src/examples/java'
        java.include 'valthorne/examples/AudioStudio.java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    uiExamples {
        java.srcDir 'src/examples/java'
        java.include 'valthorne/examples/UIShowcase.java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    uiBenchmark {
        java.srcDir 'src/benchmark/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    verificationUI {
        java.srcDir 'src/test/java'
        java.include 'valthorne/ui/**'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    verificationPhysics3D {
        java.srcDir 'src/test/java'
        java.include 'valthorne/physics3d/**'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    verification3D {
        java.srcDir 'src/test/java'
        java.include 'valthorne/model3d/**'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    examples {
        java.srcDir 'src/examples/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    audioExamplesImplementation.extendsFrom implementation, api
    audioExamplesRuntimeOnly.extendsFrom runtimeOnly
    uiExamplesImplementation.extendsFrom implementation, api
    uiExamplesRuntimeOnly.extendsFrom runtimeOnly
    uiBenchmarkImplementation.extendsFrom implementation, api
    uiBenchmarkRuntimeOnly.extendsFrom runtimeOnly
    verificationUIImplementation.extendsFrom testImplementation
    verificationUIRuntimeOnly.extendsFrom testRuntimeOnly, runtimeOnly
    verificationPhysics3DImplementation.extendsFrom testImplementation
    verificationPhysics3DRuntimeOnly.extendsFrom testRuntimeOnly, runtimeOnly
    verification3DImplementation.extendsFrom testImplementation
    verification3DRuntimeOnly.extendsFrom testRuntimeOnly, runtimeOnly
    examplesImplementation.extendsFrom implementation, api
    examplesRuntimeOnly.extendsFrom runtimeOnly
}
dependencies {
    uiBenchmarkImplementation 'org.openjdk.jmh:jmh-core:1.37'
    uiBenchmarkAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}
tasks.register('benchmarkUI', JavaExec) {
    description = 'Runs forked UI microbenchmarks with allocation profiling and JSON output.'
    group = 'verification'
    classpath = sourceSets.uiBenchmark.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    def report = providers.gradleProperty('uiBenchmarkReport').orElse('build/reports/ui-benchmark/results.json')
    args 'valthorne.ui.benchmark.*', '-foe', 'true', '-prof', 'gc', '-rf', 'json', '-rff', report.get()
    doFirst { file(report.get()).parentFile.mkdirs() }
}
tasks.register('verifyUIBenchmark') {
    description = 'Runs the complete UI benchmark suite and checks Java allocation budgets (not hardware-specific timing).'
    group = 'verification'
    dependsOn 'benchmarkUI'
    doLast {
        def report = file(providers.gradleProperty('uiBenchmarkReport').orElse('build/reports/ui-benchmark/results.json').get())
        def results = new groovy.json.JsonSlurper().parse(report)
        def expected = [
            'UIHotPathBenchmark.childrenView:': 1d,
            'UIHotPathBenchmark.cursorMovement:': 1d,
            'UIHotPathBenchmark.replaceText:': 1d,
            'UIHotPathBenchmark.sanitizeCleanText:': 1d
        ]
        ['100', '1000'].each { count ->
            expected["UIFrameBenchmark.idleUpdate:${count}".toString()] = 1d
            expected["UIFrameBenchmark.changedLayout:${count}".toString()] = 256d
            expected["UIFrameBenchmark.mixedDraw:${count}".toString()] = 1024d
        }
        ['1000', '1000000'].each { count ->
            ['pixelLookup', 'updateHeight', 'toggleSelection'].each { method ->
                expected["UIDataBenchmark.${method}:${count}".toString()] = 1d
            }
        }
        results.each { result ->
            def name = result.benchmark.replace('valthorne.ui.benchmark.', '')
            def key = name + ':' + (result.params?.nodeCount ?: result.params?.count ?: '')
            def limit = expected.remove(key)
            if (limit == null) throw new GradleException("Unexpected or duplicate UI benchmark: ${key}")
            def metric = result.secondaryMetrics['gc.alloc.rate.norm']
            def score = metric?.score
            if (!(score instanceof Number) || !Double.isFinite(score.doubleValue()) || score.doubleValue() > limit)
                throw new GradleException("${key}: allocation ${score} B/op exceeds ${limit} B/op (or profiler data is missing)")
        }
        if (!expected.isEmpty()) throw new GradleException("Missing UI benchmarks: ${expected.keySet()}")
        logger.lifecycle('All 16 UI benchmark allocation budgets passed. See JSON for timing and uncertainty.')
    }
}
tasks.register('benchmarkEngine', JavaExec) {
    description = 'Runs forked engine CPU benchmarks with allocation profiling.'
    group = 'verification'
    classpath = sourceSets.uiBenchmark.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    def report = providers.gradleProperty('engineBenchmarkReport').orElse('build/reports/engine-benchmark/results.json')
    args 'valthorne.engine.benchmark.*', '-prof', 'gc', '-rf', 'json', '-rff', report.get()
    doFirst { file(report.get()).parentFile.mkdirs() }
}

tasks.register('benchmarkAudio', JavaExec) {
    description = 'Measures ambient-zone geometry with JMH allocation profiling.'
    group = 'verification'
    classpath = sourceSets.uiBenchmark.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    args 'valthorne.audio.benchmark.*', '-foe', 'true', '-prof', 'gc', '-rf', 'json', '-rff', 'build/reports/audio-benchmark/results.json'
    doFirst { file('build/reports/audio-benchmark').mkdirs() }
}
tasks.register('verifyPhysics3D', Test) {
    description = 'Runs native Jolt physics regression tests without a graphics context.'
    group = 'verification'
    testClassesDirs = sourceSets.verificationPhysics3D.output.classesDirs
    classpath = sourceSets.verificationPhysics3D.runtimeClasspath
}
tasks.register('runPhysics3DExample', JavaExec) {
    description = 'Runs the Jolt rigid-body playground.'
    group = 'application'
    classpath = sourceSets.examples.runtimeClasspath
    mainClass = 'valthorne.examples.Physics3DExample'
}
tasks.register('runPhysicsStudio', JavaExec) {
    description = 'Runs the interactive Jolt and Filament physics laboratory.'
    group = 'application'
    classpath = sourceSets.examples.runtimeClasspath
    mainClass = 'valthorne.examples.PhysicsStudio'
}

tasks.register('runLighting2DExample', JavaExec) {
    description = 'Runs the cached 2D lighting and soft-shadow playground.'
    group = 'application'
    classpath = sourceSets.examples.runtimeClasspath
    mainClass = 'valthorne.examples.Lighting2DExample'
}
tasks.register('runPathTracingExample', JavaExec) {
    description = 'Runs the progressive GPU path-traced material studio (OpenGL 4.3).'
    group = 'application'
    classpath = sourceSets.examples.runtimeClasspath
    mainClass = 'valthorne.examples.PathTracingExample'
}
tasks.register('runLightingStudio', JavaExec) {
    description = 'Runs the editable lighting workbench; --smoke verifies the UI and --benchmark records frame times.'
    group = 'application'
    classpath = sourceSets.examples.runtimeClasspath
