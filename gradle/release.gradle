// Release archive content and Maven Central signing.

def releaseSigning = providers.gradleProperty('releaseSigning').map { it.toBoolean() }.orElse(false)

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('jar', Jar) {
    from('LICENSE') { into 'META-INF' }
    from('THIRD_PARTY_NOTICES.md') { into 'META-INF' }
    manifest {
        attributes('Implementation-Title': 'Valthorne',
                'Implementation-Version': project.version.toString())
    }
}

// A missing signing flag should fail before attempting a Central upload.
tasks.matching {
    it.name == 'publishToMavenCentral' || it.name == 'publishAndReleaseToMavenCentral' ||
            it.name.endsWith('ToMavenCentralRepository')
}.configureEach {
    doFirst {
        if (!releaseSigning.get())
            throw new GradleException('Maven Central publication requires -PreleaseSigning=true and signing credentials. Configure signing credentials in the private Gradle user home.')
    }
}
